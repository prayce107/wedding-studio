<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNDANGAN LAB - Login</title>
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #d4af37;
      --secondary: #9061f9;
      --bg-color: #0a0a0a;
      --card-bg: rgba(20, 20, 20, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --input-bg: rgba(0, 0, 0, 0.4);
      --input-border: rgba(255, 255, 255, 0.15);
      --danger: #ef4444;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at top right, rgba(212, 175, 55, 0.08), transparent 40%), 
        radial-gradient(circle at bottom left, rgba(144, 97, 249, 0.08), transparent 40%);
    }

    .container {
      width: 100%;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #000;
      margin-bottom: 15px;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
    }

    .brand h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .brand p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .alert-info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .input-field {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .input-field::placeholder {
      color: var(--text-muted);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .options input[type="checkbox"] {
      accent-color: var(--primary);
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .options a {
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }

    .options a:hover {
      color: #e5c35b;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: #e5c35b;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }

    .btn-primary:disabled {
      background: #776a44;
      color: #a0a0a0;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="glass-card">
      <div class="brand">
        <div class="logo-box">
          <i data-lucide="sparkles" style="width: 28px; height: 28px;"></i>
        </div>
        <h1>UNDANGAN LAB</h1>
        <p>Platform Undangan Digital Premium & Elegant</p>
      </div>

      <div id="error-msg" class="alert alert-danger"></div>
      <div id="info-msg" class="alert alert-info"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">
            <i data-lucide="mail" style="width: 14px; height: 14px;"></i> 
            Username atau Email
          </label>
          <input type="text" id="username" class="input-field" placeholder="admin / user / email Anda" required autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
          <label class="form-label">
            <i data-lucide="lock" style="width: 14px; height: 14px;"></i> 
            Password
          </label>
          <input type="password" id="password" class="input-field" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="options">
          <label>
            <input type="checkbox" id="remember-me">
            Remember me
          </label>
          <a href="#" id="forgot-password">Lupa password?</a>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          Masuk Ke Dashboard
        </button>
      </form>

      <div class="footer">
        <i data-lucide="key-round" style="width: 12px; height: 12px;"></i>
        <span>Sandi bawaan: <strong>admin123</strong> / <strong>user123</strong></span>
      </div>
    </div>
  </div>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- BcryptJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  
  <script>
    // Initialize Icons
    lucide.createIcons();
  </script>

  <!-- Auth Script -->
  <script src="assets/js/auth.js"></script>
</body>
</html>
